name: Sync custom branch with upstream dev

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [dev]
    paths: ['.github/workflows/sync-custom-dev.yml', '.github/release-sync/**']

permissions:
  contents: write

concurrency:
  group: sync-custom-dev
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'RyanWu080/PCL-CE-unrestrict'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: custom/dev-unrestricted
      POLICY_COMMIT: 29aad1c3deac4c87975f18fd6a9de1f1d8614874
    steps:
      - name: Check out reviewed patch and synchronization scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: automation
          persist-credentials: false
      - name: Check out custom branch with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: custom/dev-unrestricted
          path: source
          fetch-depth: 0

      - name: Merge upstream and verify the dedicated policy patch
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge-base --is-ancestor "$POLICY_COMMIT" HEAD
          git fetch --no-tags https://github.com/PCL-Community/PCL-CE.git refs/heads/dev
          upstream=$(git rev-parse FETCH_HEAD)
          python3 ../automation/.github/release-sync/sync_branch.py "$upstream"
          git merge-base --is-ancestor "$POLICY_COMMIT" HEAD
          # Normal push rejects concurrent remote changes; never force-push.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Merged upstream $upstream into $TARGET_BRANCH; policy patch preserved." >> "$GITHUB_STEP_SUMMARY"
